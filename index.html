    content="STRUKTUR Grenoble. Streetwear, sneakers & sélection premium au cœur de Grenoble. Un espace indépendant dédié à la culture urbaine." />

  <title>STRUKTUR Grenoble | Concept Store</title>
  <script>
    (() => {
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem('struktur-theme');
      } catch {
        // Keep the dark default when storage is unavailable.
      }
      const theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'dark';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'light' ? '#F6F3ED' : '#0A0A0A');
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
